<div class="flex h-screen bg-[#f5f5f5] text-[#333333] font-sans">

    <!-- SIDEBAR ÉLÉGANT -->
    <aside class="w-80 bg-white border-r border-[#e0e0e0] shadow-sm p-6 space-y-10">
      
      <!-- Logo -->
      <div class="text-3xl font-bold text-[#c8102e] text-center mb-10">FICO Intelligence</div>
  
      <!-- SECTION: Dashboard -->
      <div>
        <div class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Dashboard</div>
        <button 
          (click)="showPowerBIView()"
          class="flex items-center gap-3 w-full text-left px-5 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition shadow-sm"
        >
          <i class="bi bi-graph-up text-[#c8102e] text-xl"></i>
          <span class="font-medium">Dashboard</span>
        </button>
      </div>
  
      <!-- SECTION: Future Revenue Prediction -->
      <div>
        <div class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Future Revenue Prediction</div>
        <button 
          (click)="showPredictionView()"
          class="flex items-center gap-3 w-full text-left px-5 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition shadow-sm"
        >
          <i class="bi bi-bar-chart-line text-[#c8102e] text-xl"></i>
          <span class="font-medium">Predict Revenue</span>
        </button>
      </div>
  
      <!-- SECTION: Logout / Infos -->
      <div class="pt-10 border-t border-gray-200">
        <p class="text-xs text-gray-500 text-center">Connected as <strong>Decision Maker</strong></p>
      </div>
    </aside>
  
    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 p-6 overflow-y-auto">
      <div class="h-[90vh] mt-6 rounded-xl overflow-hidden shadow-lg bg-white border border-gray-200">
        <!-- IFRAME DASHBOARD -->
        <iframe
          *ngIf="showPowerBI"
          width="100%"
          height="100%"
          [src]="powerBIUrl"
          frameborder="0"
          allowfullscreen
          class="w-full h-full"
        ></iframe>
  
        <!-- IFRAME PRÉDICTION -->
        <iframe
          *ngIf="showPrediction"
          width="100%"
          height="100%"
          [src]="predictionUrl"
          frameborder="0"
          allowfullscreen
          class="w-full h-full"
        ></iframe>
      </div>
    </main>
  
  </div>
