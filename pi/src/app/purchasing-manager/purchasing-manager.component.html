<div class="flex h-screen bg-[#f9f9f9] text-[#333] font-sans">

    <!-- SIDEBAR RELOOKÉ -->
    <aside class="w-80 bg-white border-r border-gray-200 shadow-md p-6 space-y-10">
  
      <!-- LOGO -->
      <div class="text-3xl font-bold text-[#c8102e] text-center">FICO Intelligence</div>
  
      <!-- SECTION DASHBOARD -->
      <div>
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-3 tracking-wide">Dashboard</h3>
        <button 
          (click)="showPowerBIView()"
          class="flex items-center gap-3 w-full text-left px-5 py-3 rounded-lg bg-[#f1f1f1] hover:bg-[#e4e4e4] transition-all duration-300"
        >
          <i class="bi bi-graph-up text-[#c8102e] text-xl"></i>
          <span class="font-medium">Dashboard</span>
        </button>
      </div>
  
      <!-- SECTION PREDICTION -->
      <div>
        <h3 class="text-xs font-semibold text-gray-500 uppercase mb-3 tracking-wide">Prediction</h3>
        <button 
          (click)="showPredictionView()"
          class="flex items-center gap-3 w-full text-left px-5 py-3 rounded-lg bg-[#f1f1f1] hover:bg-[#e4e4e4] transition-all duration-300"
        >
          <i class="bi bi-exclamation-triangle text-[#c8102e] text-xl"></i>
          <span class="font-medium">Predict Dispute Possibility</span>
        </button>
      </div>
  
      <!-- INFOS USER -->
      <div class="pt-10 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-500">Connected as <strong>Decision Maker</strong></p>
      </div>
  
    </aside>
  
    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 p-6 bg-[#f9f9f9] overflow-y-auto">
      <div class="mt-10 h-[85vh] bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
        
        <!-- DASHBOARD -->
        <iframe
          *ngIf="showPowerBI"
          width="100%"
          height="100%"
          [src]="powerBIUrl"
          frameborder="0"
          allowfullscreen
          class="w-full h-full"
        ></iframe>
  
        <!-- PRÉDICTION -->
        <iframe
          *ngIf="showPrediction"
          width="100%"
          height="100%"
          [src]="predictionUrl"
          frameborder="0"
          allowfullscreen
          class="w-full h-full"
        ></iframe>
  
      </div>
    </main>
  
  </div>
