<div class="flex h-screen bg-[#f5f5f5] text-[#333333] font-sans">

  <!-- SIDEBAR MODERNE -->
  <aside class="w-80 bg-white border-r border-[#e0e0e0] shadow-sm p-6 flex flex-col justify-between">
    <div>
      <div class="text-2xl font-bold text-[#c8102e] mb-10 text-center"></div>
      <ul class="space-y-4">

        <li>
          <button 
            (click)="showLoginForm = !showLoginForm"
            class="w-full text-left px-4 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition flex items-center gap-3"
          >
            <i class="bi bi-briefcase text-[#c8102e]"></i>
            General Manager
          </button>
        </li>
        <li>
          <button 
            (click)="showLoginForm = !showLoginForm"
            class="w-full text-left px-4 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition flex items-center gap-3"
          >
            <i class="bi bi-briefcase text-[#c8102e]"></i>
            Purchasing Manager
          </button>
        </li>
        <li>
          <button 
            (click)="showLoginForm = !showLoginForm"
            class="w-full text-left px-4 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition flex items-center gap-3"
          >
            <i class="bi bi-bar-chart text-[#c8102e]"></i>
            Sales Manager
          </button>
        </li>
        <li>
          <button 
            (click)="showLoginForm = !showLoginForm"
            class="w-full text-left px-4 py-3 rounded-lg bg-[#f0f0f0] hover:bg-[#e0e0e0] transition flex items-center gap-3"
          >
            <i class="bi bi-cash-stack text-[#c8102e]"></i>
            Finance Manager
          </button>
        </li>
      </ul>
    </div>
    <div class="text-xs text-gray-500 text-center mt-10">
      © Monoprix 2025
    </div>
  </aside>

  <!-- CONTENU OU IMAGE -->
  <div class="flex-1 bg-cover bg-center relative" style="background-image: url('assets/images/dashboard/bg-light.jpg');">
    <div class="absolute inset-0 bg-white/70 backdrop-blur-sm flex items-center justify-center">
      <div class="text-center space-y-6">
        <h1 class="text-5xl font-bold">Welcome to FICO Intelligence</h1>
        <p class="text-lg max-w-2xl mx-auto">Your intelligent solution to monitor performance, resolve disputes, and predict financial outcomes.</p>
      </div>
    </div>
  </div>

  <!-- LOGIN FORM -->
  <div *ngIf="showLoginForm" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md animate-fadeIn space-y-6">
      <h2 class="text-3xl font-bold text-center text-[#c8102e]">Login</h2>
      <form class="space-y-4" (ngSubmit)="onLoginSubmit()">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email"
          required
          class="w-full p-3 border border-[#ccc] rounded-lg focus:ring-2 focus:ring-[#c8102e]"
        />
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          required
          class="w-full p-3 border border-[#ccc] rounded-lg focus:ring-2 focus:ring-[#c8102e]"
        />
        <div class="text-sm text-right text-[#666] hover:underline">
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-[#c8102e] text-white font-semibold hover:bg-[#a40d26] transition">
          Sign In
        </button>
      </form>
      <p class="text-center text-sm text-gray-500">
        By signing in, you agree to our <a href="#" class="underline text-[#c8102e]">terms</a>.
      </p>
    </div>
  </div>

</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn {
  animation: fadeIn 0.5s ease-out forwards;
}
</style>
