<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cluster Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }

        h1 {
            color: #0056b3;
        }

        form {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        label, input {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 30px;
            padding: 15px 20px;
            background-color: #e7f4e4;
            color: #2e662e;
            border: 1px solid #d6e9c6;
            border-radius: 8px;
            width: fit-content;
        }
    </style>
</head>
<body>
    <h1>Vérifier le cluster d'un client</h1>
    <form method="POST">
        <label for="client_id">ID Client :</label>
        <input type="text" name="client_id" id="client_id" required>
        <input type="submit" value="Vérifier">
    </form>

    {% if cluster_result %}
        <div class="result">
            <strong>Résultat :</strong><br>
            {{ cluster_result|safe }}
        </div>
    {% endif %}
</body>
</html>
