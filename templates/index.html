<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prévision des encaissements mensuels</title>
  <style>
    /* Styles généraux */
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5; /* Gris clair pour le fond */
      color: #333; /* Texte en gris foncé */
      margin: 0;
      padding: 0;
    }

    /* Entête */
    h2 {
      color: #d32f2f; /* Rouge pour le titre */
      text-align: center;
      margin-top: 20px;
    }

    /* Formulaire */
    form {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-top: 20px;
    }

    input[type="date"] {
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background-color: #d32f2f; /* Rouge */
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #b71c1c; /* Rouge foncé au survol */
    }

    /* Résultat */
    #result {
      text-align: center;
      font-size: 18px;
      margin-top: 20px;
      color: #444; /* Gris foncé pour le texte de résultat */
    }

    /* Ajout de style pour le fond général */
    body {
      background-color: #ffffff; /* Fond blanc */
    }
  </style>
</head>
<body>
  <h2>Entrez une date pour prédire le chiffre d'affaires</h2>
  <form id="predictForm">
    <input type="date" id="dateInput" required>
    <button type="submit">Prédire</button>
  </form>
  <h3 id="result"></h3>

  <script>
    document.getElementById('predictForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const date = document.getElementById('dateInput').value;

      fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ date: date })
      })
      .then(res => res.json())
      .then(data => {
        if (data.predicted_sales !== undefined) {
          document.getElementById('result').innerText = 
            `Prédiction pour ${data.date} : ${data.predicted_sales.toFixed(2)} euros`;
        } else {
          document.getElementById('result').innerText = 
            "Erreur : " + (data.error || "Quelque chose s'est mal passé.");
        }
      });
    });
  </script>
</body>
</html>
