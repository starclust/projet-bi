<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recommandation de Produits</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            color: #2f3640;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        h2 {
            color: #273c75;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="text"] {
            padding: 10px;
            width: 250px;
            margin: 10px 0;
            border: 1px solid #dcdde1;
            border-radius: 8px;
        }

        input[type="submit"] {
            background: #44bd32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background: #4cd137;
        }

        .error {
            color: #e84118;
            margin-top: 10px;
        }

        .results {
            margin-top: 30px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.08);
        }

        .results h3 {
            color: #192a56;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #f1f2f6;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h2>Recommandation de Produits</h2>

    <form method="post" action="/recommend">
        <label for="client_id">Identifiant du client :</label><br>
        <input type="text" name="client_id" placeholder="Ex: C12345" required><br>
        <input type="submit" value="Recommander">
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </form>

    {% if recommendations %}
        <div class="results">
            <h3>Produits recommandés pour <strong>{{ client_id }}</strong> :</h3>
            <ul>
                {% for item in recommendations %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

</body>
</html>
